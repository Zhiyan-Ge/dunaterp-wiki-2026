<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" role="img" aria-labelledby="title desc"><title id="title">Genomic DNA qPCR assay</title><desc id="desc">Protocol schematic: sample groups and programmed temperatures, not measured amplification curves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#91a49b" stroke-width="1.5"/></marker></defs><rect width="520" height="700" rx="12" fill="#f6f7ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" text-anchor="start" fill="#438b92" font-size="17">ASSAY DESIGN</text><g transform="translate(130 130)" fill="none" stroke-width="3"><path d="M-18 -48C45 -16 -45 16 18 48" stroke="#438b92"/><path d="M18 -48C-45 -16 45 16 -18 48" stroke="#70974c"/><path d="M-14 -42h28M-7 -27H7M-15 -12h30M-15 12h30M-7 27H7M-14 42h28" stroke="#a3b8ac" stroke-width="2"/></g><path d="M190 130 L325 130" fill="none" stroke="#91a49b" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(390 130)"><path d="M-24 -48h48v65L0 48l-24-31z" fill="#fff" stroke="#143f35" stroke-width="2.5"/><path d="M-19 0h38v15L0 40l-19-25z" fill="#438b92" opacity=".5"/><rect x="-29" y="-57" width="58" height="12" rx="3" fill="#e1e9dd" stroke="#143f35" stroke-width="2.5"/></g><text x="130" y="210" text-anchor="middle" fill="#143f35" font-size="23">Genomic DNA</text><text x="390" y="210" text-anchor="middle" fill="#143f35" font-size="23">qPCR</text><text x="28" y="267" text-anchor="start" fill="#143f35" font-size="20">Wild type / transgenic lines</text><text x="28" y="300" text-anchor="start" fill="#143f35" font-size="20">No-template control</text><text x="28" y="340" text-anchor="start" fill="#61786b" font-size="19">3 biological + 3 technical replicates</text><path d="M28 375H492" stroke="#d6dfd4"/><text x="28" y="414" text-anchor="start" fill="#438b92" font-size="17">THERMAL PROGRAM</text><text x="28" y="457" text-anchor="start" fill="#143f35" font-size="21">Initial denaturation: 95°C · 3 min</text><path d="M66 525H238V570H450" stroke="#438b92" stroke-width="4" fill="none"/><text x="145" y="504" text-anchor="middle" fill="#143f35" font-size="22">95°C · 10 s</text><text x="345" y="550" text-anchor="middle" fill="#143f35" font-size="22">58–60°C · 20 s</text><text x="260" y="613" text-anchor="middle" fill="#143f35" font-size="22">40 cycles</text><text x="28" y="663" text-anchor="start" fill="#143f35" font-size="20">Melt curve: 65°C → 95°C, slow ramp</text></g></svg>
