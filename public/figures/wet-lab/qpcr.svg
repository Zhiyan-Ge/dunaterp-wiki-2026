<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Genomic DNA qPCR assay</title><desc id="desc">Assay schematic and programmed temperatures from the supplied qPCR protocol, not measured amplification or melt curves.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#91a49b" stroke-width="1.5"/></marker></defs><rect width="960" height="430" rx="12" fill="#f6f7ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" text-anchor="start" fill="#61786b" font-size="12">ASSAY DESIGN &amp; THERMAL PROGRAM</text><path d="M330 65V395" stroke="#d6dfd4"/><g transform="translate(72 142)" fill="none" stroke-width="3"><path d="M-18 -48C45 -16 -45 16 18 48" stroke="#438b92"/><path d="M18 -48C-45 -16 45 16 -18 48" stroke="#70974c"/><path d="M-14 -42h28M-7 -27H7M-15 -12h30M-15 12h30M-7 27H7M-14 42h28" stroke="#a3b8ac" stroke-width="2"/></g><path d="M116 142 L165 142" fill="none" stroke="#91a49b" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(225 142)"><path d="M-24 -48h48v65L0 48l-24-31z" fill="#fff" stroke="#143f35" stroke-width="2.5"/><path d="M-19 0h38v15L0 40l-19-25z" fill="#438b92" opacity=".5"/><rect x="-29" y="-57" width="58" height="12" rx="3" fill="#e1e9dd" stroke="#143f35" stroke-width="2.5"/></g><text x="72" y="218" text-anchor="middle" fill="#143f35" font-size="17">Genomic DNA</text><text x="225" y="218" text-anchor="middle" fill="#143f35" font-size="17">qPCR</text><text x="30" y="278" text-anchor="start" fill="#143f35" font-size="16">Wild type / transgenic lines</text><text x="30" y="306" text-anchor="start" fill="#143f35" font-size="16">No-template control</text><text x="30" y="350" text-anchor="start" fill="#61786b" font-size="14">3 biological replicates</text><text x="30" y="374" text-anchor="start" fill="#61786b" font-size="14">3 technical replicates</text><text x="372" y="82" text-anchor="start" fill="#438b92" font-size="14">AMPLIFICATION</text><path d="M390 155H505V225H710" fill="none" stroke="#438b92" stroke-width="4"/><text x="445" y="127" text-anchor="middle" fill="#143f35" font-size="24">95°C</text><text x="445" y="185" text-anchor="middle" fill="#143f35" font-size="15">10 s</text><text x="607" y="202" text-anchor="middle" fill="#143f35" font-size="24">58–60°C</text><text x="607" y="254" text-anchor="middle" fill="#143f35" font-size="15">20 s</text><path d="M705 271v24H391v-58" fill="none" stroke="#91a49b" stroke-width="2" marker-end="url(#arrow)"/><text x="551" y="320" text-anchor="middle" fill="#143f35" font-size="17">40 cycles</text><text x="800" y="83" text-anchor="start" fill="#70974c" font-size="14">MELT CURVE</text><path d="M800 225L905 145" fill="none" stroke="#70974c" stroke-width="4"/><text x="800" y="254" text-anchor="middle" fill="#143f35" font-size="16">65°C</text><text x="905" y="128" text-anchor="middle" fill="#143f35" font-size="16">95°C</text><text x="851" y="295" text-anchor="middle" fill="#61786b" font-size="15">Slow ramp</text><text x="372" y="371" text-anchor="start" fill="#143f35" font-size="16">Initial denaturation: 95°C for 3 min</text><text x="372" y="399" text-anchor="start" fill="#61786b" font-size="15">Readouts: Ct values, amplification &amp; melt curves</text></g></svg>
