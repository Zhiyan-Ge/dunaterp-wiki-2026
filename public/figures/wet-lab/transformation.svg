<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">Osmotic shock transformation</title><desc id="desc">Osmotic shock transformation; arrows describe the method, not experimental results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#91a49b" stroke-width="1.5"/></marker></defs><rect width="960" height="320" rx="12" fill="#f6f7ef"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="35" text-anchor="start" fill="#61786b" font-size="12">METHOD SCHEMATIC</text><path d="M185 139 L292 139" fill="none" stroke="#91a49b" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(120 139)"><path d="M-12-48h24v28l31 54q5 9-7 9h-72q-12 0-7-9l31-54z" fill="#fff" stroke="#143f35" stroke-width="2.5"/><path d="M-23 6h46l16 29q2 3-5 3h-68q-7 0-5-3z" fill="#70974c" opacity=".45"/><path d="M-16-48h32" stroke="#143f35" stroke-width="4"/></g><text x="120" y="232" text-anchor="middle" fill="#143f35" font-size="19">Culture</text><text x="120" y="264" text-anchor="middle" fill="#61786b" font-size="14">1.5 M NaCl</text><path d="M425 139 L532 139" fill="none" stroke="#91a49b" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(360 139)"><path d="M-24 -48h48v65L0 48l-24-31z" fill="#fff" stroke="#143f35" stroke-width="2.5"/><path d="M-19 0h38v15L0 40l-19-25z" fill="#438b92" opacity=".5"/><rect x="-29" y="-57" width="58" height="12" rx="3" fill="#e1e9dd" stroke="#143f35" stroke-width="2.5"/></g><text x="360" y="232" text-anchor="middle" fill="#143f35" font-size="19">Precondition</text><text x="360" y="264" text-anchor="middle" fill="#61786b" font-size="14">1 M NaCl · 8 h</text><path d="M665 139 L772 139" fill="none" stroke="#91a49b" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(600 139)"><path d="M-8 -34C-42 -76 -63 -